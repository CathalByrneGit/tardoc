<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PKG_NAME}}</title>
<!-- Pinned to exact versions with subresource integrity. Unpinned jsdelivr
     paths silently resolve to whichever release still ships that filename,
     so the viewer's behaviour could change without any tardoc release. -->
<script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"
        integrity="sha384-948ahk4ZmxYVYOc+rxN1H2gM1EJ2Duhp7uHtZ4WSLkV4Vtx5MUqnV+l7u9B+jFv+"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/style.css"
      integrity="sha384-uySezIHhsCs2A2+GIarZ89Bi2gd6yjY0I1FFVamfrk6hgEUWLuBYlXA7bYr6dHaJ"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"
        integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"
        integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/reactflow@11.11.4/dist/umd/index.js"
        integrity="sha384-lA1w00Vex5qXDv4/xYJO/e8SCjfdlNghbTP+s+2zl37rCEAC7trsSRpYrv/JQy5y"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.2.0/dist/fuse.min.js"
        integrity="sha384-fjX7DeaZ/XFhVUVbuJ4tJCCRWoC6LtyhHqvsNRsJBcfs1VksovPjnUUGM3+Ii9st"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     display:flex;height:100vh;overflow:hidden;background:#f8f9fa;color:#212529}

  box-shadow:-8px 0 24px rgba(0,0,0,.35)}

                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1 id="site-title"></h1>
    <input id="search-box" type="search" placeholder="Search targets and functions...">
  </div>
  <div id="nav-home" onclick="goHome()">&#8962; Home</div>
  <div id="nav-tabs">
    <button class="nav-tab active" onclick="showTab('targets')">Targets</button>
    <button class="nav-tab"        onclick="showTab('functions')">Functions</button>
  </div>
  <div id="nav-list"></div>
</div>

<div id="main">
  <div id="content-area">
    <div id="home-panel">
      <h1 id="home-title"></h1>
      <p>Generated by <a href="https://github.com/CathalByrneGit/tardoc" target="_blank">tardoc</a></p>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-number" id="stat-targets">-</div>
          <div class="stat-label">Targets</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-functions">-</div>
          <div class="stat-label">Functions</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="stat-status">-</div>
          <div class="stat-label">Up-to-date</div>
        </div>
      </div>
      <h2>Pipeline overview</h2>
      <p class="graph-hint">Click a node for details &middot; drag to pan &middot; scroll to zoom
        <label class="fn-toggle"><input type="checkbox" id="show-functions"> show functions</label>
      </p>
      <div id="rf-stage">
        <div id="rf-graph"></div>
        <aside id="rf-panel" hidden aria-label="Target details"></aside>
      </div>
    </div>
    <div id="page-content" style="display:none"></div>
  </div>
</div>

<script>
const PAGES    = {{PAGES_JSON}};
const INDEX    = {{INDEX_JSON}};
const PKG_NAME = {{PKG_NAME_JSON}};
const GRAPH    = {{GRAPH_JSON}};

const PAGE_MAP = {};
PAGES.forEach(p => { PAGE_MAP[p.type + ':' + p.name] = p; });

document.getElementById('site-title').textContent = PKG_NAME;
document.getElementById('home-title').textContent = PKG_NAME;

const targets   = INDEX.targets   || [];
const functions = INDEX.functions || [];
document.getElementById('stat-targets').textContent   = targets.length;
document.getElementById('stat-functions').textContent = functions.length;
document.getElementById('stat-status').textContent    =
  targets.filter(t => t.status === 'uptodate').length;

// ---- pipeline overview: React Flow ---------------------------------------
// GRAPH carries positions computed by dag_layout() in R, because React Flow
// does no layout of its own. mermaid is no longer loaded at all: the per-target
// pages keep their ```mermaid fence so the .md files stay portable, and this
// viewer replaces each fence with renderLocalGraph() below.
const RFC = window.ReactFlow;
const rce = React.createElement;
const RF_BY_ID = {};
(GRAPH.nodes || []).forEach(function (n) { RF_BY_ID[n.id] = n; });

function rfEsc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtBytes(b) {
  if (b == null || isNaN(b)) return null;
  const u = ['B', 'kB', 'MB', 'GB'];
  let i = 0, v = Number(b);
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + ' ' + u[i];
}

function fmtSecs(sc) {
  if (sc == null || isNaN(sc)) return null;
  const v = Number(sc);
  return v < 1 ? Math.round(v * 1000) + ' ms' : v.toFixed(2) + ' s';
}

function rfChips(list) {
  if (!list || !list.length) return '<p class="none">none</p>';
  return '<div class="chips">' + list.map(function (n) {
    return '<button class="chip" data-goto="' + rfEsc(n) + '">' + rfEsc(n) + '</button>';
  }).join('') + '</div>';
}

function rfClose() { document.getElementById('rf-panel').hidden = true; }

function rfOpen(id) {
  const n = RF_BY_ID[id];
  if (!n) return;
  const rfPanel = document.getElementById('rf-panel');

  // Only surface facts that carry information. "iteration: vector" and
  // "repository: local" are the defaults and would be noise on every target.
  const kv = [];
  if (n.format) kv.push(['Format', n.format]);
  if (n.repository && n.repository !== 'local') kv.push(['Repository', n.repository]);
  if (n.iteration && n.iteration !== 'vector')  kv.push(['Iteration', n.iteration]);
  if (n.last_built) kv.push(['Last built', n.last_built]);
  const secs = fmtSecs(n.seconds); if (secs) kv.push(['Runtime', secs]);
  const size = fmtBytes(n.bytes);  if (size) kv.push(['Size', size]);

  const tags = ['<span class="tag ' + rfEsc(n.status) + '">' + rfEsc(n.status) + '</span>'];
  if (n.branched) {
    tags.push('<span class="tag branched">' +
      (n.n_branches ? n.n_branches + ' branches' : 'branched') + '</span>');
  }

  rfPanel.innerHTML =
    '<button class="close" aria-label="Close">&times;</button>' +
    '<h3>' + rfEsc(n.label) + '</h3>' +
    '<div class="tags">' + tags.join('') + '</div>' +
    (n.description ? '<h4>Description</h4><p>' + rfEsc(n.description) + '</p>'
                   : '<p class="none">no description</p>') +
    (n.branched ? '<h4>Branching</h4><pre>' + rfEsc(n.pattern) + '</pre>' : '') +
    (n.command ? '<h4>Command</h4><pre>' + rfEsc(n.command) + '</pre>' : '') +
    (n.error    ? '<h4>Error</h4><pre>' + rfEsc(n.error) + '</pre>' : '') +
    (n.warnings ? '<h4>Warnings</h4><pre>' + rfEsc(n.warnings) + '</pre>' : '') +
    (kv.length ? '<h4>Details</h4><div class="kv">' + kv.map(function (p) {
        return '<span>' + rfEsc(p[0]) + '</span><span>' + rfEsc(p[1]) + '</span>';
      }).join('') + '</div>' : '') +
    '<h4>Depends on</h4>' + rfChips(n.upstream) +
    '<h4>Feeds into</h4>' + rfChips(n.downstream) +
    '<button class="open">Open full page &rarr;</button>';

  rfPanel.hidden = false;
  rfPanel.querySelector('.close').onclick = rfClose;
  rfPanel.querySelectorAll('[data-goto]').forEach(function (b) {
    b.onclick = function () { rfOpen(b.getAttribute('data-goto')); };
  });
  rfPanel.querySelector('.open').onclick = function () {
    rfClose();
    showTab('targets');
    loadPage('targets', n.id);
  };
  rfPanel.scrollTop = 0;
}

document.addEventListener('keydown', function (ev) {
  if (ev.key === 'Escape') rfClose();
});

// A target and its immediate neighbours, standing in for the mermaid fence on
// each target page. Built from GRAPH -- the same data the fence came from --
// rather than by parsing mermaid syntax.
function renderLocalGraph(host, centre) {
  const node = RF_BY_ID[centre];
  if (!node) { host.remove(); return; }
  const ups = (node.upstream   || []).filter(function (n) { return RF_BY_ID[n]; });
  const dns = (node.downstream || []).filter(function (n) { return RF_BY_ID[n]; });
  if (!ups.length && !dns.length) { host.remove(); return; }

  const tallest = Math.max(ups.length, dns.length, 1);
  const place = [];
  ups.forEach(function (n, i) {
    place.push([n, 0, (i + (tallest - ups.length) / 2) * 80]);
  });
  place.push([centre, 250, ((tallest - 1) / 2) * 80]);
  dns.forEach(function (n, i) {
    place.push([n, 500, (i + (tallest - dns.length) / 2) * 80]);
  });

  const lnodes = place.map(function (p) {
    const n = RF_BY_ID[p[0]];
    const cls = 'tnode ' + n.status + ' ' + (n.kind || 'stem') +
                (n.id === centre ? ' centre' : '');
    return {
      id: n.id,
      position: { x: p[1], y: p[2] },
      data: { label: rce('div', { className: cls },
        rce('div', { className: 'nm' }, n.label),
        rce('div', { className: 'st' },
            n.kind === 'function' ? 'function' : n.status)) },
      sourcePosition: RFC.Position.Right,
      targetPosition: RFC.Position.Left,
      style: { background: 'transparent', border: 'none', padding: 0, width: 'auto' }
    };
  });

  const ids = {}; lnodes.forEach(function (n) { ids[n.id] = 1; });
  const ledges = (GRAPH.edges || []).filter(function (d) {
    return ids[d.source] && ids[d.target];
  }).map(function (d) {
    return { id: 'l-' + d.id, source: d.source, target: d.target,
             style: { stroke: '#a6adc8', strokeWidth: 1.5 },
             markerEnd: { type: RFC.MarkerType.ArrowClosed, color: '#a6adc8' } };
  });

  const RFlow = RFC.ReactFlow || RFC.default;
  ReactDOM.createRoot(host).render(
    rce(RFlow, {
      defaultNodes: lnodes, defaultEdges: ledges,
      fitView: true, fitViewOptions: { padding: 0.2 },
      minZoom: 0.2, nodesDraggable: false,
      onNodeClick: function (_ev, n) {
        const t = RF_BY_ID[n.id];
        if (!t || t.id === centre) return;
        const type = t.kind === 'function' ? 'functions' : 'targets';
        showTab(type);
        loadPage(type, n.id);
      }
    }, rce(RFC.Background, { color: '#313244', gap: 16 }))
  );
}

let rfRoot = null;

// Functions are hidden by default: on a large pipeline they roughly double the
// node count and the targets are what a reader is usually after.
function renderOverview(showFunctions) {
  const visible = GRAPH.nodes.filter(function (n) {
    return showFunctions || n.kind !== 'function';
  });
  const ids = {}; visible.forEach(function (n) { ids[n.id] = 1; });

  const rfNodes = visible.map(function (n) {
    const kids = [rce('div', { className: 'nm' }, n.label),
                  rce('div', { className: 'st' },
                      n.kind === 'function' ? 'function' : n.status)];
    if (n.branched) {
      kids.push(rce('div', { className: 'br' },
        n.n_branches ? n.n_branches + ' branches' : 'branched'));
    }
    return {
      id: n.id,
      position: { x: n.x, y: n.y },
      data: { label: rce.apply(null,
        ['div', { className: 'tnode ' + n.status + ' ' + (n.kind || 'stem') }].concat(kids)) },
      sourcePosition: RFC.Position.Right,
      targetPosition: RFC.Position.Left,
      style: { background: 'transparent', border: 'none', padding: 0, width: 'auto' }
    };
  });
  const rfEdges = (GRAPH.edges || [])
    .filter(function (d) { return ids[d.source] && ids[d.target]; })
    .map(function (d) {
      return { id: d.id, source: d.source, target: d.target,
               style: { stroke: '#a6adc8', strokeWidth: 1.5 },
               markerEnd: { type: RFC.MarkerType.ArrowClosed, color: '#a6adc8' } };
    });

  const RFlow = RFC.ReactFlow || RFC.default;
  if (!rfRoot) rfRoot = ReactDOM.createRoot(document.getElementById('rf-graph'));
  rfRoot.render(
    rce(RFlow, {
      nodes: rfNodes, edges: rfEdges,
      fitView: true, fitViewOptions: { padding: 0.15 }, minZoom: 0.1,
      nodesDraggable: true,
      onNodeClick: function (_ev, node) { rfOpen(node.id); },
      onPaneClick: rfClose
    },
      rce(RFC.Background, { color: '#313244', gap: 16 }),
      rce(RFC.Controls, null),
      rce(RFC.MiniMap, { pannable: true, zoomable: true,
        style: { background: '#181825' }, maskColor: 'rgba(30,30,46,0.75)',
        nodeColor: function () { return '#45475a'; } })
    )
  );
}

if (GRAPH.nodes && GRAPH.nodes.length) {
  renderOverview(false);
  const fnBox = document.getElementById('show-functions');
  const anyFn = GRAPH.nodes.some(function (n) { return n.kind === 'function'; });
  if (!anyFn) {
    fnBox.closest('.fn-toggle').style.display = 'none';
  } else {
    fnBox.addEventListener('change', function () {
      rfClose();
      renderOverview(fnBox.checked);
    });
  }
} else {
  document.getElementById('rf-stage').innerHTML =
    '<p style="color:#6c7086;font-style:italic;padding:20px">No targets to graph.</p>';
}


let currentTab = 'targets';
let currentKey = null;

function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0 && tab === 'targets') ||
                                   (i === 1 && tab === 'functions'));
  });
  renderNavList(null, tab);
}

function renderNavList(filter, tab) {
  const list  = document.getElementById('nav-list');
  list.innerHTML = '';
  const items = tab === 'targets' ? targets : functions;
  const shown = filter
    ? items.filter(i =>
        i.name.toLowerCase().includes(filter.toLowerCase()) ||
        (i.description || '').toLowerCase().includes(filter.toLowerCase()))
    : items;

  if (shown.length === 0) {
    list.innerHTML = '<div class="no-content">No results</div>';
    return;
  }
  shown.forEach(item => {
    const div = document.createElement('div');
    div.className = 'nav-item' +
      (currentKey === tab + ':' + item.name ? ' active' : '');
    if (tab === 'targets') {
      const cls = item.status === 'uptodate'  ? 'badge-ok'  :
                  item.status === 'errored'    ? 'badge-err' : 'badge-na';
      div.innerHTML = item.name +
        '<span class="badge ' + cls + '">' + (item.status || '?') + '</span>';
    } else {
      div.textContent = item.name;
    }
    div.onclick = () => loadPage(tab, item.name);
    list.appendChild(div);
  });
}

function loadPage(type, name) {
  const key  = type + ':' + name;
  const page = PAGE_MAP[key];
  currentKey = key;
  // Record the page in the hash so it can be linked to and survives a reload.
  // The graph page links here as viewer.html#targets:<name>.
  if (location.hash.slice(1) !== key) {
    history.replaceState(null, '', '#' + key);
  }
  renderNavList(document.getElementById('search-box').value, currentTab);

  document.getElementById('home-panel').style.display   = 'none';
  document.getElementById('page-content').style.display = '';

  const contentEl = document.getElementById('page-content');
  contentEl.innerHTML = page
    ? marked.parse(page.content)
    : '<div class="no-content">No content found.</div>';

  // The markdown keeps its ```mermaid fence so the .md files stay portable
  // (GitHub renders them). The viewer no longer loads mermaid: it replaces each
  // fence with a React Flow graph built from GRAPH, the same data the fence was
  // generated from.
  contentEl.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
    const host = document.createElement('div');
    host.className = 'local-graph';
    code.parentNode.replaceWith(host);
    renderLocalGraph(host, name);
  });

  // Intercept .md links — route through loadPage
  contentEl.querySelectorAll('a').forEach(a => {
    const href = a.getAttribute('href') || '';
    if (!href.endsWith('.md')) return;
    const segs   = href.split('/');
    const folder = segs[segs.length - 2];
    const lname  = segs[segs.length - 1].slice(0, -3);
    if (folder === 'targets' || folder === 'functions') {
      a.addEventListener('click', e => {
        e.preventDefault();
        showTab(folder);
        loadPage(folder, lname);
      });
    }
  });

  // Inline notes — strip stub comments, show user content if any
  const notes = page ? (page.notes || '').trim() : '';
  const stripped = notes.replace(/<!--[^]*?-->/g, '').trim();
  if (stripped.length > 0) {
    const notesDiv = document.createElement('div');
    notesDiv.className = 'notes-section';
    notesDiv.innerHTML = '<h2>&#128221; Notes</h2>' + marked.parse(stripped);
    contentEl.appendChild(notesDiv);
  }

  window.scrollTo(0, 0);
  contentEl.parentElement.scrollTo(0, 0);
}

function goHome() {
  document.getElementById('home-panel').style.display   = '';
  document.getElementById('page-content').style.display = 'none';
  currentKey = null;
  renderNavList(null, currentTab);
}

// Pan/zoom state
let pzScale = 1, pzTx = 0, pzTy = 0, pzPanning = false, pzX0 = 0, pzY0 = 0;

// Deep linking: #targets:<name> or #functions:<name>.
function openFromHash() {
  const key = decodeURIComponent(location.hash.slice(1));
  if (!key || !PAGE_MAP[key]) return false;
  const sep = key.indexOf(':');
  const type = key.slice(0, sep);
  const name = key.slice(sep + 1);
  showTab(type);
  loadPage(type, name);
  return true;
}
window.addEventListener('hashchange', openFromHash);

// Fuse.js search
const fuse = new Fuse([...targets, ...functions], {
  keys: ['name', 'description', 'command'],
  threshold: 0.35,
  includeScore: true
});

document.getElementById('search-box').addEventListener('input', function() {
  const q = this.value.trim();
  if (!q) { renderNavList(null, currentTab); return; }
  const results = fuse.search(q).slice(0, 30);
  const list = document.getElementById('nav-list');
  list.innerHTML = '';
  if (results.length === 0) {
    list.innerHTML = '<div class="no-content">No results</div>';
    return;
  }
  results.forEach(r => {
    const item = r.item;
    const div  = document.createElement('div');
    div.className = 'search-result' +
      (currentKey === item.type + ':' + item.name ? ' active' : '');
    div.innerHTML =
      '<div class="search-result-name">' + item.name +
      '<span class="item-type">' + item.type + '</span></div>' +
      '<div class="search-result-desc">' + (item.description || '') + '</div>';
    div.onclick = () => loadPage(item.type, item.name);
    list.appendChild(div);
  });
});

renderNavList(null, 'targets');

// A deep link wins over the default home view.
openFromHash();
</script>
</body>
</html>
