# Publishes the example pipeline's docs to GitHub Pages.
#
# This is tardoc documenting a real pipeline with itself: the site at
# https://<owner>.github.io/tardoc/ is generated from
# inst/examples/station-monitoring, nothing in it is hand-written, and it
# rebuilds on every push to main. It doubles as the end-to-end test that
# document_targets() works on a clean machine with no store to start from.
#
# For your own pipeline repository, copy inst/templates/pipeline-docs.yaml
# rather than this file -- it builds the project at the repository root.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; let a newer commit supersede an in-flight run, but
# never cancel a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
          needs: check

      - name: Build the example pipeline and document it
        run: |
          setwd("inst/examples/station-monitoring")
          targets::tar_make()
          tardoc::document_targets(
            pkg_name = "Station Monitoring Pipeline",
            repo_url = paste0(
              "https://github.com/", Sys.getenv("GITHUB_REPOSITORY"),
              "/blob/main/inst/examples/station-monitoring/"
            )
          )
          # Pages serves index.html at the site root.
          file.copy("tardoc/viewer.html", "tardoc/index.html", overwrite = TRUE)
        shell: Rscript {0}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: inst/examples/station-monitoring/tardoc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
