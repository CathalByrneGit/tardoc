# Builds and publishes everything the project shows the world, in one Pages
# deployment:
#
#   /          the documentation site, built by litedown from site/ + the
#              installed package (README, Rd pages, examples, playground)
#   /example/  the tier 1 viewer, generated from the example pipeline in
#              inst/examples/station-monitoring
#
# The second half is tardoc documenting a real pipeline with itself: nothing in
# it is hand-written, and it doubles as the end-to-end test that
# document_targets() works on a clean machine with no store to start from.
#
# For your own pipeline repository, copy inst/templates/pipeline-docs.yaml
# rather than this file -- it builds the project at the repository root.

name: github-pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; let a newer commit supersede an in-flight run, but
# never cancel a deploy half-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Imports only: the site and the example pipeline need nothing from
      # Suggests, and skipping them keeps duckdb, ellmer and devtools out of a
      # build that would only install them to leave them unused.
      # apt-packages is not optional here: this action installs R packages with
      # base R and does nothing about system requirements, so the RSPM binary of
      # igraph (a targets dependency) arrives unable to load for want of
      # libglpk.so.40. r-lib/actions resolves sysreqs itself, which is why
      # R-CMD-check never saw this.
      - uses: yihui/actions/setup-r-dependencies@main
        with:
          dependencies: 'Depends, Imports, LinkingTo'
          extra-packages: litedown xfun .
          r-universe: yihui
          apt-packages: libglpk-dev libxml2-dev

      # litedown adds a subfolder to the nav bar when it already contains an
      # index.html, and it computes the nav before rendering anything -- so on a
      # fresh checkout the Notes pages would be built but not linked. A
      # backdated placeholder puts them in the nav; it is older than its own
      # source, so fuse_site() still rebuilds it. site/example/ has no source of
      # its own and is filled in below.
      - name: Reserve the subfolder nav entries
        run: |
          mkdir -p site/notes site/example
          touch -d '2000-01-01' site/notes/index.html site/example/index.html

      - uses: yihui/actions/litedown-site@main
        with:
          site-dir: 'site'
          # The default leaves the .md sources beside the .html they produced,
          # and the action ships its own playground/ whether or not the package
          # provides one -- this site has no use for a webR editor.
          cleanup: 'rm -f *.Rmd *.md *.yml _*; rm -rf playground'

      # Must come after the site build: these are hundreds of .md files, and
      # litedown would otherwise render every one of them as a site page.
      - name: Build the example pipeline and document it
        run: |
          setwd("inst/examples/station-monitoring")
          targets::tar_make()
          tardoc::document_targets(
            pkg_name = "Station Monitoring Pipeline",
            repo_url = paste0(
              "https://github.com/", Sys.getenv("GITHUB_REPOSITORY"),
              "/blob/main/inst/examples/station-monitoring/"
            )
          )
          # Pages serves index.html at a directory's root.
          file.copy("tardoc/viewer.html", "tardoc/index.html", overwrite = TRUE)
        shell: Rscript {0}

      - name: Place the viewer under /example/
        run: cp -r inst/examples/station-monitoring/tardoc/. site/example/

      # Pull requests get the whole site as a downloadable artifact instead of a
      # deployment, so a docs change can be read before it is published.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: site

      # enablement turns Pages on if it is not already. Without it the first
      # deploy fails with "Get Pages site failed ... verify that the repository
      # has Pages enabled", which is what has kept this site from ever going
      # live -- the build was only half the problem.
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
